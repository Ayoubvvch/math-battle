<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Math Battle: d/dx Calculus Showdown [GODMODE PILOT EDITION]</title>
  <meta name="description" content="Take absolute control of d/dx! Full Gamepad, Virtual Joystick, Triple Dash, Calculus Beam & Leibniz Bomb.">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #030712;
      --border: #1f2937;
      --cyan: #00f0ff;
      --orange: #ff5500;
      --green: #10b981;
      --red: #ff0055;
      --purple: #c026d3;
      --gold: #ffd700;
      --text: #f8fafc;
      --muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .app-shell {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      max-height: 980px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.12);
      overflow: hidden;
    }
    /* Battle Selection Bar */
    .roster-tabs {
      display: flex;
      background: #02040a;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
      padding: 6px 8px;
      gap: 6px;
    }
    .roster-tabs::-webkit-scrollbar { display: none; }
    .roster-btn {
      flex: 1;
      min-width: 85px;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      text-align: center;
    }
    .roster-btn.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }
    /* Pilot & Controller Status Bar */
    .pilot-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #010204;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 10px;
    }
    .pilot-toggle-group {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .pilot-toggle-btn {
      background: transparent;
      border: none;
      color: #64748b;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 800;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .pilot-toggle-btn.active {
      background: var(--cyan);
      color: #000000;
      font-weight: 900;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    }
    .controller-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      font-weight: 800;
      color: #10b981;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pad-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    /* Viewport */
    .viewport {
      position: relative;
      width: 100%;
      flex: 1;
      background: #000000;
      touch-action: none;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Mobile Touch Overlay Controls */
    .touch-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 12px;
    }
    .touch-stick-area {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 50%;
      height: 55%;
      pointer-events: auto;
      touch-action: none;
    }
    .touch-cluster {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
      pointer-events: auto;
    }
    .touch-btn {
      pointer-events: auto;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid var(--cyan);
      color: #ffffff;
      font-weight: 900;
      font-size: 9px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
      cursor: pointer;
      user-select: none;
      touch-action: none;
      transition: all 0.08s ease;
    }
    .touch-btn:active, .touch-btn.active {
      transform: scale(0.90);
    }
    .touch-btn-dash {
      border-color: #00f0ff;
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .touch-btn-dash:active {
      background: #00f0ff;
      color: #000;
    }
    .touch-btn-beam {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .touch-btn-beam:active {
      background: #10b981;
      color: #000;
    }
    .touch-btn-bomb {
      border-color: #ff0055;
      background: rgba(255, 0, 85, 0.2);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
    }
    .touch-btn-bomb:active {
      background: #ff0055;
      color: #fff;
    }
    /* Control Deck */
    .deck {
      background: #020307;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--border);
    }
    .action-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.12s ease;
      white-space: nowrap;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-primary {
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #000000;
      border: none;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
      flex: 1.2;
    }
    .btn-action {
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: #ffffff;
      border: none;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.4);
    }
    .btn-speed.active {
      background: rgba(0, 240, 255, 0.2);
      color: var(--cyan);
      border-color: var(--cyan);
    }
    .hud-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: #64748b;
      font-weight: 700;
    }
    .frenzy-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      background: rgba(255, 85, 0, 0.1);
      border: 1px solid rgba(255, 85, 0, 0.3);
      border-radius: 999px;
      color: var(--orange);
      font-weight: 900;
      font-size: 9px;
    }
    .guide-box {
      text-align: center;
      font-size: 9px;
      color: #94a3b8;
      padding: 4px 6px;
      background: #010205;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      line-height: 1.3;
    }
    .guide-box b {
      color: var(--cyan);
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Battle Selection Roster -->
    <div class="roster-tabs">
      <button class="roster-btn active" data-match="x3">d/dx VS x³</button>
      <button class="roster-btn" data-match="x4">d/dx VS x⁴ [CHAOS]</button>
      <button class="roster-btn" data-match="sin">d/dx VS sin(x)</button>
      <button class="roster-btn" data-match="exp">d/dx VS eˣ [IMMORTAL]</button>
    </div>

    <!-- Pilot Control Bar -->
    <div class="pilot-bar">
      <div class="pilot-toggle-group">
        <button id="pilotPlayer" class="pilot-toggle-btn active">🎮 YOU ARE d/dx</button>
        <button id="pilotAuto" class="pilot-toggle-btn">🤖 AUTO AI</button>
      </div>

      <div class="controller-badge">
        <span class="pad-dot" id="padDot"></span>
        <span id="padStatus">KEYBOARD / TOUCH ACTIVE</span>
      </div>
    </div>

    <!-- Canvas Viewport -->
    <div class="viewport" id="viewport">
      <canvas id="gameCanvas" width="540" height="960"></canvas>

      <!-- On-Screen Mobile Touch Joystick & Powers Cluster -->
      <div class="touch-stick-area" id="touchStickArea"></div>
      <div class="touch-controls">
        <div></div>
        <div class="touch-cluster">
          <button class="touch-btn touch-btn-bomb" id="touchBombBtn">
            <span>💥 BOMB</span>
            <span style="font-size: 7px; opacity: 0.85;">[B / E]</span>
          </button>
          <button class="touch-btn touch-btn-beam" id="touchBeamBtn">
            <span>🎯 BEAM</span>
            <span style="font-size: 7px; opacity: 0.85;">[X / F]</span>
          </button>
          <button class="touch-btn touch-btn-dash" id="touchDashBtn">
            <span>⚡ DASH</span>
            <span style="font-size: 7px; opacity: 0.85;">[A / SPC]</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Instructions Guide Bar -->
    <div class="guide-box">
      🎮 <b>PAD:</b> L-STICK=MOVE • R-STICK/MOUSE=AIM • <b>A:</b> DASH (x3) • <b>X/RT:</b> BEAM • <b>B/Y:</b> BOMB<br>
      ⌨️ <b>KEY:</b> WASD=MOVE • MOUSE=AIM • <b>SPACE:</b> DASH • <b>F/L-CLICK:</b> BEAM • <b>E/Q/R-CLICK:</b> BOMB
    </div>

    <!-- Controls Deck -->
    <div class="deck">
      <div class="action-row">
        <button id="btnStart" class="btn btn-primary">▶ START BATTLE</button>
        <button id="btnRestart" class="btn">🔄 RE-ROLL (SEED)</button>
        <button id="btnAudio" class="btn">🔊 ON</button>
      </div>

      <div class="hud-meta">
        <div class="action-row" style="gap: 4px;">
          <button class="btn btn-speed active" data-speed="1">1X</button>
          <button class="btn btn-speed" data-speed="1.5">1.5X</button>
          <button class="btn btn-speed" data-speed="2">2X</button>
        </div>

        <div class="frenzy-pill" id="frenzyTag">
          <span style="width: 5px; height: 5px; border-radius: 50%; background: var(--orange);"></span>
          <span id="frenzyLabel">60FPS GODMODE ARENA</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       MATH BATTLE: d/dx ARCADE SHOWDOWN [GODMODE PILOT EDITION]
       Features:
       - 100% Direct Vector Flight (No oil-slick inertia, no gravity drag)
       - 3x Rechargeable Chain Rule Dashes with Invulnerability & Slashing
       - Piercing Calculus Beam Weapon (Ranged sniping against swarms)
       - Leibniz Supernova Bomb (Screen-wide wipe & laser barrier cancel)
       - Lifesteal: +3 HP healed per differentiation!
       - Full Gamepad API (Xbox, PS4, PS5, DualSense Rumble)
       - Virtual Touch Joystick + Ergonomic 3-Power Cluster
       ========================================================== */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const btnStart = document.getElementById('btnStart');
    const btnRestart = document.getElementById('btnRestart');
    const btnAudio = document.getElementById('btnAudio');
    const speedButtons = document.querySelectorAll('.btn-speed');
    const rosterTabs = document.querySelectorAll('.roster-btn');
    const pilotPlayer = document.getElementById('pilotPlayer');
    const pilotAuto = document.getElementById('pilotAuto');
    const padStatus = document.getElementById('padStatus');
    const padDot = document.getElementById('padDot');
    const frenzyLabel = document.getElementById('frenzyLabel');
    const touchDashBtn = document.getElementById('touchDashBtn');
    const touchBeamBtn = document.getElementById('touchBeamBtn');
    const touchBombBtn = document.getElementById('touchBombBtn');
    const touchStickArea = document.getElementById('touchStickArea');

    let currentMatch = 'x3';
    let isPlayerControlled = true; // Default: YOU ARE d/dx!
    let simSpeed = 1.0;
    let audioEnabled = true;
    let isRunning = true;

    // Arena Definition
    const ARENA = {
      x: 35,
      y: 195,
      width: 470,
      height: 470,
      xMin: -5,
      xMax: 5,
      yMin: -5,
      yMax: 5
    };

    function toScreenX(x) {
      return ARENA.x + ((x - ARENA.xMin) / (ARENA.xMax - ARENA.xMin)) * ARENA.width;
    }
    function toScreenY(y) {
      return ARENA.y + ((ARENA.yMax - y) / (ARENA.yMax - ARENA.yMin)) * ARENA.height;
    }

    /* ---------------- Audio & Haptic Feedback ---------------- */
    let audioCtx = null;
    let lastAudioTime = { wall: 0, ball: 0, beam: 0 };

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function triggerRumble(weakIntensity = 0.3, strongIntensity = 0.5, duration = 150) {
      if (navigator.vibrate) {
        navigator.vibrate(Math.min(100, duration));
      }
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const gp of gamepads) {
        if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
          gp.vibrationActuator.playEffect("dual-rumble", {
            startDelay: 0,
            duration: duration,
            weakMagnitude: weakIntensity,
            strongMagnitude: strongIntensity
          }).catch(() => {});
        }
      }
    }

    function playSound(type, panX = 0, pitchMod = 1.0) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        let dest = audioCtx.destination;

        if (audioCtx.createStereoPanner) {
          const panner = audioCtx.createStereoPanner();
          panner.pan.setValueAtTime(Math.max(-1, Math.min(1, panX)), now);
          panner.connect(dest);
          dest = panner;
        }

        if (type === 'wall_hit') {
          if (now - lastAudioTime.wall < 0.03) return;
          lastAudioTime.wall = now;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(260 * pitchMod, now);
          osc.frequency.exponentialRampToValueAtTime(75 * pitchMod, now + 0.04);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'ball_clack') {
          if (now - lastAudioTime.ball < 0.025) return;
          lastAudioTime.ball = now;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1050 * pitchMod, now);
          osc.frequency.exponentialRampToValueAtTime(280 * pitchMod, now + 0.04);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'diff_strike') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650 * pitchMod, now);
          osc.frequency.exponentialRampToValueAtTime(1350 * pitchMod, now + 0.16);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'dash') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(1100, now + 0.14);
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.14);
        } else if (type === 'beam') {
          if (now - lastAudioTime.beam < 0.08) return;
          lastAudioTime.beam = now;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.12);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'bomb') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.45);
          gain.gain.setValueAtTime(0.55, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'heal') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(783, now + 0.05);
          osc.frequency.setValueAtTime(1046, now + 0.10);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'laser_warn') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320 * pitchMod, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (type === 'laser_fire') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220 * pitchMod, now);
          osc.frequency.linearRampToValueAtTime(800 * pitchMod, now + 0.32);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'player_dmg') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(35, now + 0.2);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'pop_zero') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1150 * pitchMod, now);
          osc.frequency.exponentialRampToValueAtTime(2300 * pitchMod, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.connect(gain);
          gain.connect(dest);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'victory') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + idx * 0.08);
            gain.gain.setValueAtTime(0.22, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(dest);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.4);
          });
        }
      } catch (e) {}
    }

    /* ---------------- Input Subsystems: Gamepad, Touch, Keyboard ---------------- */
    const keys = {
      up: false, down: false, left: false, right: false
    };

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
        e.preventDefault();
        triggerDash();
      }
      if (e.code === 'KeyF' || e.code === 'KeyJ' || e.code === 'KeyK') {
        e.preventDefault();
        triggerBeam();
      }

          const rx = touchJoystick.currentX - touchJoystick.startX;

    /* ---------------- Billiard Elastic Physics Resolvers ---------------- */
    function enforceSpeed(b, targetSpeed) {
      const spd = Math.hypot(b.vx, b.vy);
      if (spd > 0.0001) {
        b.vx = (b.vx / spd) * targetSpeed;
        b.vy = (b.vy / spd) * targetSpeed;
      } else {
        const ang = Math.random() * Math.PI * 2;
        b.vx = Math.cos(ang) * targetSpeed;
        b.vy = Math.sin(ang) * targetSpeed;
      }
    }

    function resolveWallBounce(b, targetSpeed) {
      let bounced = false;
      const rMath = (b.radius / ARENA.width) * (ARENA.xMax - ARENA.xMin);

      if (b.x - rMath < ARENA.xMin) {
        b.x = ARENA.xMin + rMath; b.vx = Math.abs(b.vx); bounced = true;
      } else if (b.x + rMath > ARENA.xMax) {
        b.x = ARENA.xMax - rMath; b.vx = -Math.abs(b.vx); bounced = true;
      }
      if (b.y - rMath < ARENA.yMin) {
        b.y = ARENA.yMin + rMath; b.vy = Math.abs(b.vy); bounced = true;
      } else if (b.y + rMath > ARENA.yMax) {
        b.y = ARENA.yMax - rMath; b.vy = -Math.abs(b.vy); bounced = true;
      }

      if (bounced) {
        enforceSpeed(b, targetSpeed);
        playSound('wall_hit', b.x / 5.0, frenzyMultiplier);
      }
    }

    function resolveBallBallCollision(b1, b2, targetSpeed) {
      const x1 = toScreenX(b1.x);
      const y1 = toScreenY(b1.y);
      const x2 = toScreenX(b2.x);
      const y2 = toScreenY(b2.y);

      const dx = x2 - x1;
      const dy = y2 - y1;
      const dist = Math.hypot(dx, dy);
      const minDist = b1.radius + b2.radius;

      if (dist < minDist && dist > 0.0001) {
        const overlap = minDist - dist;
        const nx = dx / dist;
        const ny = dy / dist;
        const overlapMath = (overlap / ARENA.width) * (ARENA.xMax - ARENA.xMin);

        b1.x -= nx * (overlapMath * 0.5);
        b1.y += ny * (overlapMath * 0.5);
        b2.x += nx * (overlapMath * 0.5);
        b2.y -= ny * (overlapMath * 0.5);

        const mdx = b2.x - b1.x;
        const mdy = b2.y - b1.y;
        const mdist = Math.hypot(mdx, mdy) || 1;
        const mnx = mdx / mdist;
        const mny = mdy / mdist;

        const kx = b1.vx - b2.vx;
        const ky = b1.vy - b2.vy;
        const p = (mnx * kx + mny * ky);

        b1.vx -= p * mnx; b1.vy -= p * mny;
        b2.vx += p * mnx; b2.vy += p * mny;

        enforceSpeed(b1, targetSpeed);
        enforceSpeed(b2, targetSpeed);

        playSound('ball_clack', (b1.x + b2.x) / 10.0, frenzyMultiplier);
      }
    }

            y: Math.max(-4.2, Math.min(4.2, ball.y + Math.sin(ang) * bMathR * 1.4)),
            vx: Math.cos(ang) * curSpeed * 1.15, vy: Math.sin(ang) * curSpeed * 1.15,
            radius: 32, color: '#ffd700', halo: 'rgba(255, 215, 0, 0.25)'
          });
        }
      }

      if (remainingHits <= 0 || balls.length === 0) {
        gameState = 'VICTORY';
        playSound('victory');
        triggerRumble(0.6, 1.0, 400);
        for (let k = 0; k < 60; k++) {
          spawnParticle(ARENA.x + Math.random() * ARENA.width, ARENA.y + Math.random() * ARENA.height, '#00f0ff', 4, 80, 0.15);
        }
      }
    }

    /* ---------------- Graph Laser Hazard Cycle ---------------- */
    function startGraphSummon() {
      summonCurves = [];
      balls.forEach(ball => {
        if (ball.type === 'x4' || ball.type === 'x3') {
          summonCurves.push({ type: 'parabola', x0: ball.x, y0: ball.y, a: (Math.random() > 0.5 ? 0.35 : -0.35), color: '#ff5500' });
        } else if (ball.type === 'x2') {
          summonCurves.push({ type: 'parabola', x0: ball.x, y0: ball.y, a: 0.4, color: '#f97316' });
        } else if (ball.type === 'x') {
          summonCurves.push({ type: 'line', x0: ball.x, y0: ball.y, m: (Math.random() > 0.5 ? 0.85 : -0.85), color: '#fb923c' });
        } else if (ball.type === '1') {
          summonCurves.push({ type: 'horizontal', y0: ball.y, color: '#ffd700' });
        } else if (ball.type.includes('sin') || ball.type.includes('cos')) {
          summonCurves.push({ type: 'sine', x0: ball.x, y0: ball.y, a: 1.5, w: 1.8, color: '#10b981' });
        } else if (ball.type === 'exp') {
          summonCurves.push({ type: 'exp', x0: ball.x, y0: ball.y, color: '#ffd700' });
        }
      });
      summonState = 'WARNING';
      summonTimer = 1.4; // 1.4s clear warning to dodge or bomb
      playSound('laser_warn', 0, frenzyMultiplier);
    }

    function distanceToCurve(mx, my, curve) {
      if (curve.type === 'horizontal') return Math.abs(my - curve.y0);
      if (curve.type === 'line') {
        const A = curve.m, B = -1, C = curve.y0 - curve.m * curve.x0;
        return Math.abs(A * mx + B * my + C) / Math.sqrt(A * A + B * B);
      }
      if (curve.type === 'parabola') return Math.abs(my - (curve.a * Math.pow(mx - curve.x0, 2) + curve.y0));
      if (curve.type === 'sine') return Math.abs(my - (curve.a * Math.sin(curve.w * (mx - curve.x0)) + curve.y0));
      if (curve.type === 'exp') return Math.abs(my - (0.25 * Math.exp(Math.min(3, mx - curve.x0)) + curve.y0));
      return 999;
    }

    /* ---------------- Master Update Loop ---------------- */
    let lastTimestamp = performance.now();

    function update(dt) {
      if (screenShake > 0) screenShake -= dt * 30;

      if (gameState === 'COUNTDOWN') {
        countdownTimer -= dt;
        if (countdownTimer > 2.6 && !countdownStepPlayed[3]) {
          countdownStepPlayed[3] = true; playSound('wall_hit', 0, 1.2);
        } else if (countdownTimer <= 2.6 && countdownTimer > 1.6 && !countdownStepPlayed[2]) {
          countdownStepPlayed[2] = true; playSound('wall_hit', 0, 1.4);
        } else if (countdownTimer <= 1.6 && countdownTimer > 0.6 && !countdownStepPlayed[1]) {
          countdownStepPlayed[1] = true; playSound('wall_hit', 0, 1.6);
        } else if (countdownTimer <= 0.6 && !countdownStepPlayed.fight) {
          countdownStepPlayed.fight = true; playSound('diff_strike', 0, 1.8);
        }
        if (countdownTimer <= 0) gameState = 'PLAYING';
        return;
      }

      if (gameState !== 'PLAYING') {
        updateFX(dt);
        return;
      }

      // Frenzy Speed Escalation
      const progress = 1.0 - (remainingHits / totalInitialHits);
      if (progress > 0.45) {
        frenzyMultiplier = 1.0 + (progress - 0.45) * 0.85;
        frenzyLabel.textContent = `OVERDRIVE [${Math.round(frenzyMultiplier * 100)}%] 🔥`;
      } else {
        frenzyMultiplier = 1.0;
        frenzyLabel.textContent = "60FPS GODMODE ARENA";
      }

      const curPlayerSpeed = BASE_PLAYER_SPEED * frenzyMultiplier;
      const curBallSpeed = BASE_BALL_SPEED * frenzyMultiplier;

      // Cooldown & Recharge Timers
      if (player.comboTimer > 0) {
        player.comboTimer -= dt;
        if (player.comboTimer <= 0) player.combos = 0;
      }
      if (player.invulnerableTimer > 0) player.invulnerableTimer -= dt;
      if (player.hitCooldown > 0) player.hitCooldown -= dt;
      if (player.beamCooldown > 0) player.beamCooldown -= dt;

      // Dash Recharge (Up to 3 charges)
      if (player.dashCharges < player.maxDashCharges) {
        player.dashRechargeTimer += dt;
        if (player.dashRechargeTimer >= player.dashRechargeTime) {
          player.dashCharges++;
          player.dashRechargeTimer = 0;
        }
      }

      // Passive Bomb Charge
      if (player.bombEnergy < 100) {
        player.bombEnergy = Math.min(100, player.bombEnergy + dt * 4.0); // +4% per sec
      }

      // Dash state update
      if (player.isDashing) {
        player.dashTimer -= dt;
        if (player.dashTimer <= 0) player.isDashing = false;
      }

      // --- PLAYER CONTROLLER INPUT RESOLUTION ---
      if (isPlayerControlled) {
        let inputX = 0;
        let inputY = 0;

        // 1. Keyboard
        if (keys.left) inputX -= 1;
        if (keys.right) inputX += 1;
        if (keys.up) inputY += 1; // Math Y is positive upwards
        if (keys.down) inputY -= 1;

        // 2. Mobile Touch Joystick
        if (touchJoystick.active) {
          inputX += touchJoystick.dx;
          inputY -= touchJoystick.dy; // invert screen Y to math Y
        }

        // 3. Physical Gamepad Polling
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (const gp of gamepads) {
          if (!gp) continue;
          const axisX = gp.axes[0];
          const axisY = -gp.axes[1];
          const deadzone = 0.12;
          if (Math.abs(axisX) > deadzone) inputX += axisX;
          if (Math.abs(axisY) > deadzone) inputY += axisY;

          if (gp.buttons[14] && gp.buttons[14].pressed) inputX -= 1;
          if (gp.buttons[15] && gp.buttons[15].pressed) inputX += 1;
          if (gp.buttons[12] && gp.buttons[12].pressed) inputY += 1;
          if (gp.buttons[13] && gp.buttons[13].pressed) inputY -= 1;

          // Right Stick Aiming (Twin-stick arcade style)
          const rAxisX = gp.axes[2];
          const rAxisY = -gp.axes[3];
          if (Math.hypot(rAxisX, rAxisY) > 0.25) {
            player.facingAng = Math.atan2(rAxisY, rAxisX);
            if (Math.hypot(rAxisX, rAxisY) > 0.65) triggerBeam(); // auto-fire on full tilt!
          }


          // Gamepad Buttons
          if (gp.buttons[0] && gp.buttons[0].pressed) triggerDash();
          if ((gp.buttons[2] && gp.buttons[2].pressed) || (gp.buttons[7] && gp.buttons[7].pressed) || (gp.buttons[5] && gp.buttons[5].pressed)) triggerBeam();
          if ((gp.buttons[1] && gp.buttons[1].pressed) || (gp.buttons[3] && gp.buttons[3].pressed)) triggerBomb();
        }

        const inputMag = Math.hypot(inputX, inputY);

        if (player.isDashing) {
          // Locked in dashing velocity
        } else {
          // PRECISION VECTOR FLIGHT (Zero Sluggishness)
          const topSpeed = curPlayerSpeed * 1.3;
          if (inputMag > 0.08) {
            const normX = inputX / (inputMag > 1 ? inputMag : 1);
            const normY = inputY / (inputMag > 1 ? inputMag : 1);
            player.facingAng = Math.atan2(normY, normX);

            // Responsive acceleration
            const responsiveness = 42.0;
            player.vx += (normX * topSpeed - player.vx) * Math.min(1, responsiveness * dt);
            player.vy += (normY * topSpeed - player.vy) * Math.min(1, responsiveness * dt);
          } else {
            // Precision air-brake (clean stop on release)
            const friction = 14.0;
            player.vx -= player.vx * Math.min(1, friction * dt);
            player.vy -= player.vy * Math.min(1, friction * dt);
            if (Math.hypot(player.vx, player.vy) < 0.05) {
              player.vx = 0;
              player.vy = 0;
            }
          }
        }
      } else {
        // AUTONOMOUS SPECTATOR AI
        if (balls.length > 0) {
          let closest = balls[0];
          let minDist = Math.hypot(closest.x - player.x, closest.y - player.y);
          for (let i = 1; i < balls.length; i++) {
            const d = Math.hypot(balls[i].x - player.x, balls[i].y - player.y);
            if (d < minDist) { minDist = d; closest = balls[i]; }
          }
          const dx = closest.x - player.x, dy = closest.y - player.y;
          const dist = Math.hypot(dx, dy) || 1;
          player.vx += (dx / dist) * 12.0 * dt;
          player.vy += (dy / dist) * 12.0 * dt;
          enforceSpeed(player, curPlayerSpeed);
          player.facingAng = Math.atan2(player.vy, player.vx);

          if (Math.random() < 0.02) triggerBeam();
          if (player.bombEnergy >= 100 && balls.length > 10) triggerBomb();
        }
      }

      // Move Player
      player.x += player.vx * dt;
      player.y += player.vy * dt;

      // Smooth Wall Gliding (No violent bounces)
      const prMath = (player.radius / ARENA.width) * (ARENA.xMax - ARENA.xMin);
      if (player.x - prMath < ARENA.xMin) { player.x = ARENA.xMin + prMath; player.vx = Math.max(0, player.vx); }
      if (player.x + prMath > ARENA.xMax) { player.x = ARENA.xMax - prMath; player.vx = Math.min(0, player.vx); }
      if (player.y - prMath < ARENA.yMin) { player.y = ARENA.yMin + prMath; player.vy = Math.max(0, player.vy); }
      if (player.y + prMath > ARENA.yMax) { player.y = ARENA.yMax - prMath; player.vy = Math.min(0, player.vy); }

      player.trail.unshift({ x: toScreenX(player.x), y: toScreenY(player.y) });
      if (player.trail.length > 16) player.trail.pop();

      // Move Beams & Check Collisions
      beamPool.forEach(b => {
        if (!b.active) return;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life += dt;
        if (b.life >= b.maxLife || b.x < ARENA.xMin || b.x > ARENA.xMax || b.y < ARENA.yMin || b.y > ARENA.yMax) {
          b.active = false;
          return;
        }

        // Beam vs Balls
        for (let i = balls.length - 1; i >= 0; i--) {
          const ball = balls[i];
          const dist = Math.hypot(ball.x - b.x, ball.y - b.y);
          const hitDist = (ball.radius / ARENA.width) * (ARENA.xMax - ARENA.xMin) * 1.2;
          if (dist <= hitDist) {
            b.active = false;
            strikeAndDifferentiate(ball);
            break;
          }
        }
      });

      // Move Balls
      balls.forEach(b => {
        enforceSpeed(b, curBallSpeed);
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        resolveWallBounce(b, curBallSpeed);
      });

      // Ball vs Ball Rigid Collisions
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            resolveBallBallCollision(balls[i], balls[j], curBallSpeed);
          }
        }
      }

      // Player vs Ball Collision (Slicing Attack / Predator)
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        const spx = toScreenX(player.x), spy = toScreenY(player.y);
        const sbx = toScreenX(b.x), sby = toScreenY(b.y);
        const dist = Math.hypot(spx - sbx, spy - sby);
        const minDist = player.radius + b.radius + (player.isDashing ? 18 : 0);

        if (dist <= minDist) {
          // In Dashing Mode: Slashing Slice with zero knockback
          if (player.isDashing) {
            strikeAndDifferentiate(b);
          } else {
            // Direct operator contact: Player knocks enemy ball away!
            const nx = (sbx - spx) / (dist || 1);
            const ny = (sby - spy) / (dist || 1);

            b.vx = nx * curBallSpeed * 1.5;
            b.vy = -ny * curBallSpeed * 1.5;
            enforceSpeed(b, curBallSpeed * 1.3);

            if (player.hitCooldown <= 0) {
              strikeAndDifferentiate(b);
              break;
            }
          }
        }
      }

      // Laser Hazard Cycle
      summonTimer -= dt;
      if (summonState === 'IDLE' && summonTimer <= 0) {
        startGraphSummon();
      } else if (summonState === 'WARNING' && summonTimer <= 0) {
        summonState = 'LASER';
        summonTimer = 1.2;
        playSound('laser_fire', 0, frenzyMultiplier);
      } else if (summonState === 'LASER') {
        if (player.invulnerableTimer <= 0 && !player.isDashing) {
          for (let curve of summonCurves) {
            const dist = distanceToCurve(player.x, player.y, curve);
            if (dist < 0.35) {
              const dmg = Math.floor(10 + Math.random() * 5); // Balanced damage
              player.hp = Math.max(0, player.hp - dmg);
              player.invulnerableTimer = 0.9;
              screenShake = 10;

              triggerRumble(0.7, 0.9, 200);
              playSound('player_dmg', player.x / 5.0);
              spawnPopup(`-${dmg}`, toScreenX(player.x), toScreenY(player.y) - 10, '#ff0055', true);
              for (let k = 0; k < 12; k++) spawnParticle(toScreenX(player.x), toScreenY(player.y), '#ff0055', 2.5);

              if (player.hp <= 0) {
                gameState = 'GAMEOVER';
                playSound('wall_hit', 0, 0.5);
              }
              break;
            }
          }
        }

        if (summonTimer <= 0) {
          summonState = 'IDLE';
          summonCurves = [];
          summonTimer = (4.8 + Math.random() * 2.5) / frenzyMultiplier;
        }
      }

      updateFX(dt);
    }

    function updateFX(dt) {
      particlePool.forEach(p => {
        if (!p.active) return;
        p.life += dt * 30;
        p.x += p.vx; p.y += p.vy;
        p.vy += p.gravity;
        p.alpha = Math.max(0, 1 - (p.life / p.maxLife));
        if (p.life >= p.maxLife) p.active = false;
      });

      popupPool.forEach(p => {
        if (!p.active) return;
        p.life += dt * 30;
        p.y += p.vy;
        p.alpha = Math.max(0, 1 - (p.life / p.maxLife));
        if (p.life >= p.maxLife) p.active = false;
      });

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += dt * 260;
        sw.alpha = Math.max(0, 1 - (sw.r / sw.maxR));
        if (sw.r >= sw.maxR) shockwaves.splice(i, 1);
      }
    }

    /* ---------------- High-Speed Zero-Lag Renderer ---------------- */
    function render() {
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCyberHeader();
      drawArenaGrid();
      drawLaserCurves();
      drawBeams();
      drawShockwaves();
      drawBalls();
      drawPlayer();
      drawTouchJoystickIndicator();
      drawPopups();
      drawParticles();
      drawBottomHUD();
      drawOverlays();

      ctx.restore();
    }

    function drawCyberHeader() {
      const px = 95, py = 95, r = 36;

      ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
      ctx.beginPath(); ctx.arc(px, py, r + 6, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fillStyle = '#010c14'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#00f0ff'; ctx.stroke();

      ctx.fillStyle = '#00f0ff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'italic bold 20px "Cambria Math", serif';
      ctx.fillText('d', px, py - 11);
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(px - 14, py); ctx.lineTo(px + 14, py);
      ctx.strokeStyle = '#00f0ff'; ctx.stroke();
      ctx.fillText('dx', px, py + 13);

      ctx.font = '900 11px "Segoe UI", sans-serif';
      ctx.fillText(isPlayerControlled ? 'PILOT (YOU)' : 'DERIVATIVE', px, py + r + 16);

      ctx.font = '900 32px "Segoe UI", sans-serif';
      ctx.fillStyle = '#f8fafc';
      ctx.fillText('VS', 270, py);

      const bx = 445, by = 95;
      let bColor = '#ff5500', bLbl = 'x³', bSub = 'CUBIC BOSS';
      if (currentMatch === 'x4') { bColor = '#c026d3'; bLbl = 'x⁴'; bSub = 'QUARTIC SWARM'; }
      else if (currentMatch === 'sin') { bColor = '#10b981'; bLbl = 'sin(x)'; bSub = 'TRIG WAVE'; }
      else if (currentMatch === 'exp') { bColor = '#ffd700'; bLbl = 'eˣ'; bSub = 'IMMORTAL'; }

      ctx.fillStyle = 'rgba(255, 85, 0, 0.08)';
      ctx.beginPath(); ctx.arc(bx, by, r + 6, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2);
      ctx.fillStyle = '#140600'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = bColor; ctx.stroke();

      ctx.fillStyle = bColor;
      ctx.font = 'italic bold 22px "Cambria Math", serif';
      ctx.fillText(bLbl, bx, by);

      ctx.font = '900 11px "Segoe UI", sans-serif';
      ctx.fillText(bSub, bx, by + r + 16);
    }

    function drawArenaGrid() {
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.0;
      ctx.strokeRect(ARENA.x, ARENA.y, ARENA.width, ARENA.height);

      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1.0;
      for (let x = ARENA.xMin; x <= ARENA.xMax; x++) {
        if (x === 0) continue;
        const sx = toScreenX(x);
        ctx.moveTo(sx, ARENA.y); ctx.lineTo(sx, ARENA.y + ARENA.height);
      }
      for (let y = ARENA.yMin; y <= ARENA.yMax; y++) {
        if (y === 0) continue;
        const sy = toScreenY(y);
        ctx.moveTo(ARENA.x, sy); ctx.lineTo(ARENA.x + ARENA.width, sy);
      }
      ctx.stroke();

      const ox = toScreenX(0), oy = toScreenY(0);
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1.6;
      ctx.moveTo(ARENA.x, oy); ctx.lineTo(ARENA.x + ARENA.width, oy);
      ctx.moveTo(ox, ARENA.y + ARENA.height); ctx.lineTo(ox, ARENA.y);
      ctx.stroke();

      ctx.fillStyle = '#64748b';
      ctx.font = 'italic 14px "Cambria Math", serif';
      ctx.fillText('O', ox - 10, oy + 12);
      ctx.fillText('x', ARENA.x + ARENA.width - 12, oy + 14);
      ctx.fillText('y', ox - 12, ARENA.y + 12);
    }

    function drawLaserCurves() {
      if (summonCurves.length === 0) return;
      ctx.save();
      ctx.beginPath();
      ctx.rect(ARENA.x, ARENA.y, ARENA.width, ARENA.height);
      ctx.clip();

      const isLaser = (summonState === 'LASER');

      summonCurves.forEach(c => {
        ctx.beginPath();
        if (c.type === 'horizontal') {
          const sy = toScreenY(c.y0);
          ctx.moveTo(ARENA.x, sy); ctx.lineTo(ARENA.x + ARENA.width, sy);
        } else if (c.type === 'line') {
          const yL = c.m * (ARENA.xMin - c.x0) + c.y0;
          const yR = c.m * (ARENA.xMax - c.x0) + c.y0;
          ctx.moveTo(toScreenX(ARENA.xMin), toScreenY(yL));
          ctx.lineTo(toScreenX(ARENA.xMax), toScreenY(yR));
        } else if (c.type === 'parabola') {
          for (let step = 0; step <= 60; step++) {
            const mx = ARENA.xMin + (step / 60) * (ARENA.xMax - ARENA.xMin);
            const my = c.a * Math.pow(mx - c.x0, 2) + c.y0;
            const sx = toScreenX(mx), sy = toScreenY(my);
            if (step === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
        } else if (c.type === 'sine') {
          for (let step = 0; step <= 80; step++) {
            const mx = ARENA.xMin + (step / 80) * (ARENA.xMax - ARENA.xMin);
            const my = c.a * Math.sin(c.w * (mx - c.x0)) + c.y0;
            const sx = toScreenX(mx), sy = toScreenY(my);
            if (step === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
        } else if (c.type === 'exp') {
          for (let step = 0; step <= 60; step++) {
            const mx = ARENA.xMin + (step / 60) * (ARENA.xMax - ARENA.xMin);
            const my = 0.25 * Math.exp(Math.min(3, mx - c.x0)) + c.y0;
            const sx = toScreenX(mx), sy = toScreenY(my);
            if (step === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
          }
        }

        if (isLaser) {
          ctx.strokeStyle = c.color || '#ff5500';
          ctx.lineWidth = 4.5;
          ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.8;
          ctx.stroke();
        } else {
          ctx.strokeStyle = 'rgba(255, 85, 0, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([8, 8]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      });
      ctx.restore();
    }

    function drawBeams() {
      beamPool.forEach(b => {
        if (!b.active) return;
        const sx = toScreenX(b.x), sy = toScreenY(b.y);
        const ang = Math.atan2(b.vy, b.vx);
        const len = 22;

        ctx.save();
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx - Math.cos(ang) * len, sy + Math.sin(ang) * len);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawShockwaves() {
      shockwaves.forEach(sw => {
        ctx.save();
        ctx.globalAlpha = sw.alpha;
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      });
    }

    function drawBalls() {
      balls.forEach(b => {
        const sx = toScreenX(b.x), sy = toScreenY(b.y);

        ctx.fillStyle = b.halo || 'rgba(255, 85, 0, 0.15)';
        ctx.beginPath(); ctx.arc(sx, sy, b.radius + 4, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath(); ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#0a0400'; ctx.fill();
        ctx.lineWidth = 2.5; ctx.strokeStyle = b.color; ctx.stroke();

        ctx.fillStyle = b.color;
        ctx.font = `italic bold ${Math.round(b.radius * 0.9)}px "Cambria Math", serif`;
        ctx.fillText(b.label, sx, sy + 1);
      });
    }

    function drawPlayer() {
      const sx = toScreenX(player.x), sy = toScreenY(player.y);

      // Facing Direction Indicator Cone
      ctx.save();
      const faceX = sx + Math.cos(player.facingAng) * 36;
      const faceY = sy - Math.sin(player.facingAng) * 36;
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(faceX, faceY);
      ctx.stroke();
      ctx.restore();

      // Trail
      if (player.trail.length > 2) {
        ctx.beginPath();
        ctx.moveTo(player.trail[0].x, player.trail[0].y);
        for (let i = 1; i < player.trail.length; i++) ctx.lineTo(player.trail[i].x, player.trail[i].y);
        ctx.strokeStyle = player.isDashing ? 'rgba(0, 240, 255, 0.9)' : 'rgba(0, 240, 255, 0.35)';
        ctx.lineWidth = player.isDashing ? 5.0 : 2.0;
        ctx.stroke();
      }

      ctx.save();
      if (player.invulnerableTimer > 0 && Math.floor(player.invulnerableTimer * 20) % 2 === 0) {
        ctx.globalAlpha = 0.4;
      }

      ctx.fillStyle = player.isDashing ? 'rgba(0, 240, 255, 0.4)' : 'rgba(0, 240, 255, 0.12)';
      ctx.beginPath(); ctx.arc(sx, sy, player.radius + 6, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath(); ctx.arc(sx, sy, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#001424'; ctx.fill();
      ctx.lineWidth = player.isDashing ? 4.5 : 2.8;
      ctx.strokeStyle = '#00f0ff';
      ctx.stroke();

      ctx.fillStyle = '#00f0ff';
      ctx.font = 'italic bold 13px "Cambria Math", serif';
      ctx.fillText('d', sx, sy - 7);
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(sx - 9, sy); ctx.lineTo(sx + 9, sy);
      ctx.strokeStyle = '#00f0ff'; ctx.stroke();
      ctx.fillText('dx', sx, sy + 7);
      ctx.restore();
    }

    function drawTouchJoystickIndicator() {
      if (!touchJoystick.active) return;
      ctx.save();
      ctx.beginPath();
      ctx.arc(touchJoystick.startX, touchJoystick.startY, 50, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
      ctx.lineWidth = 2.0;
      ctx.stroke();

      const stickX = touchJoystick.startX + touchJoystick.dx * 45;
      const stickY = touchJoystick.startY + touchJoystick.dy * 45;
      ctx.beginPath();
      ctx.arc(stickX, stickY, 22, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.fill();
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }

    function drawPopups() {
      popupPool.forEach(p => {
        if (!p.active) return;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        if (p.isDmg) {
          ctx.font = '900 32px "Segoe UI", sans-serif';
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
        } else {
          ctx.font = 'italic bold 22px "Cambria Math", serif';
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
          if (p.fromPlayer) {
            ctx.beginPath();
            ctx.moveTo(toScreenX(player.x), toScreenY(player.y));
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }
        }
        ctx.restore();
      });
    }

    function drawParticles() {
      particlePool.forEach(pt => {
        if (!pt.active) return;
        ctx.save();
        ctx.globalAlpha = pt.alpha;
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
    }

    function drawBottomHUD() {
      const barY = 705, bw = 215, bh = 22;
      const leftX = ARENA.x;
      const hpPct = Math.max(0, player.hp / player.maxHp);

      // Player Health Bar
      ctx.fillStyle = '#111827'; ctx.fillRect(leftX, barY, bw, bh);
      ctx.fillStyle = '#00f0ff'; ctx.fillRect(leftX, barY, bw * hpPct, bh);
      ctx.fillStyle = '#000000';
      ctx.font = '900 12px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`HP: ${player.hp} / ${player.maxHp}`, leftX + bw / 2, barY + bh / 2);

      // Dash & Bomb Bars
      ctx.font = '800 11px "Segoe UI", sans-serif';
      ctx.textAlign = 'left';

      // Dash Charges (3 Pips)
      let dashTxt = `DASH: `;
      for (let i = 0; i < player.maxDashCharges; i++) {
        dashTxt += (i < player.dashCharges ? '⚡ ' : '○ ');
      }
      ctx.fillStyle = player.dashCharges > 0 ? '#00f0ff' : '#64748b';
      ctx.fillText(dashTxt, leftX, barY + bh + 16);

      // Super Bomb Meter
      const bombReady = (player.bombEnergy >= 100);
      ctx.fillStyle = bombReady ? '#ffd700' : '#ff0055';
      const bombTxt = bombReady ? `💥 BOMB [READY]` : `💥 BOMB [${Math.floor(player.bombEnergy)}%]`;
      ctx.fillText(bombTxt, leftX + 115, barY + bh + 16);

      // Enemy Hits Bar
      const rightX = ARENA.x + ARENA.width - bw;
      const remPct = Math.max(0, remainingHits / totalInitialHits);
      ctx.fillStyle = '#111827'; ctx.fillRect(rightX, barY, bw, bh);
      ctx.fillStyle = '#ff5500'; ctx.fillRect(rightX, barY, bw * remPct, bh);
      ctx.fillStyle = '#000000';
      ctx.textAlign = 'center';
      ctx.fillText(`${remainingHits} / ${totalInitialHits}`, rightX + bw / 2, barY + bh / 2);

      ctx.textAlign = 'right';
      if (gameState === 'COUNTDOWN') {
        ctx.fillStyle = '#64748b'; ctx.fillText('[SYSTEM: READY]', rightX + bw, barY + bh + 16);
      } else if (summonState === 'WARNING' || summonState === 'LASER') {
        ctx.fillStyle = '#ff5500'; ctx.fillText('[LASER WARNING!]', rightX + bw, barY + bh + 16);
      } else {
        ctx.fillStyle = '#94a3b8'; ctx.fillText(`[ACTIVE ORBS: ${balls.length}]`, rightX + bw, barY + bh + 16);
      }
    }

    function drawOverlays() {
      const cx = ARENA.x + ARENA.width / 2;
      const cy = ARENA.y + ARENA.height / 2;
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      if (gameState === 'COUNTDOWN') {
        if (countdownTimer > 2.6) {
          ctx.font = '900 110px "Segoe UI", sans-serif'; ctx.fillStyle = '#f8fafc'; ctx.fillText('3', cx, cy);
        } else if (countdownTimer > 1.6) {
          ctx.font = '900 110px "Segoe UI", sans-serif'; ctx.fillStyle = '#f8fafc'; ctx.fillText('2', cx, cy);
        } else if (countdownTimer > 0.6) {
          ctx.font = '900 110px "Segoe UI", sans-serif'; ctx.fillStyle = '#f8fafc'; ctx.fillText('1', cx, cy);
        } else {
          ctx.font = '900 75px "Segoe UI", sans-serif'; ctx.fillStyle = '#ff0055'; ctx.fillText('FIGHT!', cx, cy);
        }
      } else if (gameState === 'VICTORY') {
        ctx.font = '900 48px "Segoe UI", sans-serif'; ctx.fillStyle = '#00f0ff';
        ctx.fillText('DERIVATIVE VICTORY!', cx, cy - 20);
        ctx.font = '800 20px "Segoe UI", sans-serif'; ctx.fillStyle = '#ffffff';
        ctx.fillText('POLYNOMIAL ANNIHILATED!', cx, cy + 20);
      } else if (gameState === 'GAMEOVER') {
        ctx.font = '900 46px "Segoe UI", sans-serif'; ctx.fillStyle = '#ff0055';
        ctx.fillText('DERIVATIVE DEFEATED!', cx, cy - 20);
      }
      ctx.restore();
    }

    /* ---------------- Game Loop (60 FPS Locked) ---------------- */
    function gameLoop(timestamp) {
      const rawDt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;
      const dt = Math.min(rawDt, 0.05) * simSpeed;

      if (isRunning) update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    /* ---------------- UI Event Handlers ---------------- */
    pilotPlayer.addEventListener('click', () => {
      isPlayerControlled = true;
      pilotPlayer.classList.add('active');
      pilotAuto.classList.remove('active');
    });

    pilotAuto.addEventListener('click', () => {
      isPlayerControlled = false;
      pilotAuto.classList.add('active');
      pilotPlayer.classList.remove('active');
    });

    btnStart.addEventListener('click', () => {
      initAudio();
      isRunning = !isRunning;
      btnStart.textContent = isRunning ? '⏸ PAUSE BATTLE' : '▶ RESUME BATTLE';
      btnStart.className = isRunning ? 'btn btn-primary' : 'btn btn-action';
    });

    btnRestart.addEventListener('click', () => {
      initAudio();
      resetGame(currentMatch);
      isRunning = true;
      btnStart.textContent = '⏸ PAUSE BATTLE';
      btnStart.className = 'btn btn-primary';
    });

    btnAudio.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      btnAudio.textContent = audioEnabled ? '🔊 ON' : '🔇 OFF';
      btnAudio.style.opacity = audioEnabled ? '1.0' : '0.6';
    });

    speedButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        speedButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        simSpeed = parseFloat(btn.dataset.speed);
      });
    });

    rosterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        rosterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        resetGame(tab.dataset.match);
      });
    });

    // Start Simulation
    resetGame('x3');
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
